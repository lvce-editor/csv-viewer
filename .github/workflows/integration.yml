name: Integration
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: node packages/build/src/build.ts
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: b02dd3925819f684aaff24e70d54dfc9547dfc64
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Test extension view Explorer focus handoff
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.extension-view-explorer-focus
        shell: bash
      - name: Test CSV save and unsaved-close protection
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.csv-save
        shell: bash
      - name: Test CSV grid editing
        if: matrix.os == 'ubuntu-24.04'
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless -- --test-name-prefix=viewlet.csv-edit-grid
        shell: bash
